services:
  - type: web
    name: ruatoan-basic
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ruatoan-basic-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: ruatoan-basic-db
    region: singapore
    databaseName: ruatoan_basic
    plan: free
