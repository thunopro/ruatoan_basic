      <div>
        <h1>Bài nộp</h1>
        <p class="lead">Ảnh bài làm được lưu trong PostgreSQL và chỉ tài khoản của bạn xem được.</p>
      </div>
    </header>

    <form id="upload-form" class="form">
      <label>Chọn tối đa 6 ảnh JPG, PNG hoặc WebP<input type="file" name="files" accept="image/jpeg,image/png,image/webp" multiple required></label>
      <button class="btn" type="submit">Tải ảnh lên</button>
      <p id="message" class="small" role="status"></p>
    </form>

    <div id="photos" class="thumbs"></div>

    <h2 class="sec">Đổi mật khẩu</h2>
    <form id="password-form" class="form">
      <label>Mật khẩu hiện tại<input type="password" name="old_password" minlength="8" required></label>
      <label>Mật khẩu mới<input type="password" name="new_password" minlength="8" required></label>
      <button class="btn" type="submit">Đổi mật khẩu</button>
      <p id="password-message" class="small" role="status"></p>
    </form>
  </main>
  <footer class="foot">
    <div class="foot-in">
      <p><b>Rùa Toán</b> · Ảnh bài làm chỉ hiển thị với tài khoản đã tải lên.</p>
    </div>
  </footer>
