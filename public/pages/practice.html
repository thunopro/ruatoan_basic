<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Luyện tập bài tập Toán theo chủ đề và khối lớp trên Rùa Toán.">
  <title>Luyện bài · Rùa Toán</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f5f8f4'/%3E%3Cellipse cx='28' cy='35' rx='18' ry='14' fill='%23c5ef79' stroke='%23184635' stroke-width='3'/%3E%3Cpath d='M12 35h32M28 21v28' fill='none' stroke='%234c8f67' stroke-width='2'/%3E%3Ccircle cx='49' cy='30' r='9' fill='%2377b78c' stroke='%23184635' stroke-width='3'/%3E%3Ccircle cx='52' cy='28' r='1.5' fill='%2317352a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/original.css">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/practice.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="main">
    <header class="phead">
      <svg viewBox="0 0 200 210" width="80" height="84" class="phead-art" aria-hidden="true"><ellipse cx="100" cy="201" rx="64" ry="8" fill="rgba(0,0,0,.35)"></ellipse><ellipse cx="100" cy="72" rx="60" ry="52" fill="#5cc85a"></ellipse><g><circle cx="81" cy="75" r="6.5" fill="#0d1a0f"></circle><circle cx="119" cy="75" r="6.5" fill="#0d1a0f"></circle></g><ellipse cx="100" cy="72" rx="60" ry="52" fill="none" stroke="#0d1a0f" stroke-width="5"></ellipse></svg>
      <div><h1>Luyện bài</h1><p>Tìm câu hỏi theo chủ đề và khối lớp; mở đề gốc để xem đầy đủ bộ câu hỏi.</p></div>
    </header>
    <form id="search-form" class="filters">
      <input id="search" placeholder="Tìm tên đề hoặc tỉnh/thành" aria-label="Tìm tên đề hoặc tỉnh/thành">
      <select id="grade" aria-label="Chọn khối lớp">
        <option value="0">Tất cả khối lớp</option>
        <option value="6">Lớp 6</option>
        <option value="7">Lớp 7</option>
        <option value="8">Lớp 8</option>
        <option value="9">Lớp 9</option>
        <option value="10">Lớp 10</option>
      </select>
      <select id="topic" aria-label="Chọn chủ đề">
        <option value="">Tất cả chủ đề</option>
        <option value="so-hoc">Số học</option>
        <option value="dai-so">Đại số</option>
        <option value="hinh-hoc">Hình học</option>
        <option value="bat-dang-thuc">Bất đẳng thức</option>
        <option value="to-hop">Tổ hợp</option>
      </select>
      <button class="btn primary">Tìm kiếm</button>
    </form>
    <p class="result-count" id="result-count"></p>
    <div id="results" class="plist"></div>
    <nav class="pager" aria-label="Xem thêm">
      <button id="more" class="btn big primary" hidden>Xem thêm câu hỏi ↓</button>
    </nav>
  </main>
  <footer class="foot">
    <div class="foot-in">
      <p class="small"><b>Rùa Toán</b> · Dữ liệu bài tập được cập nhật qua API của RuaToanBasic.</p>
    </div>
  </footer>
</body>
</html>
