<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tạo tài khoản Rùa Toán miễn phí để luyện tập và lưu bài làm.">
  <title>Đăng ký · Rùa Toán</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d1a0f'/%3E%3Cellipse cx='32' cy='33' rx='25' ry='23' fill='%237b5a2c' stroke='%23b6ff3b' stroke-width='3'/%3E%3Cpath d='M32 17l9 5v10l-9 5-9-5V22z' fill='%235cc85a' stroke='%230d1a0f' stroke-width='2.5'/%3E%3Cpath d='M32 37v9M23 32l-9 5M41 32l9 5M23 22l-8-5M41 22l8-5M32 17v-5M8 27h48v8H8z' stroke='%230d1a0f' stroke-width='2.5' fill='%232f8cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/original.css">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/common.js?v=3"></script>
  <script defer src="/js/account.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container narrow">
    <h1>Tạo tài khoản</h1>
    <form id="account-form" class="form">
      <label>Tên hiển thị<input type="text" name="name" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Mật khẩu (ít nhất 8 ký tự)<input type="password" name="password" minlength="8" required></label>
      <button class="btn primary">Đăng ký</button>
      <p id="message"></p>
    </form>
    <p>Đã có tài khoản? <a href="/pages/login.html">Đăng nhập</a></p>
  </main>
  <footer>Rùa Toán Basic</footer>
</body>
</html>
