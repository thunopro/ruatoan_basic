<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tạo tài khoản Rùa Toán miễn phí để luyện tập và lưu bài làm.">
  <title>Đăng ký · Rùa Toán</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f5f8f4'/%3E%3Cellipse cx='28' cy='35' rx='18' ry='14' fill='%23c5ef79' stroke='%23184635' stroke-width='3'/%3E%3Cpath d='M12 35h32M28 21v28' fill='none' stroke='%234c8f67' stroke-width='2'/%3E%3Ccircle cx='49' cy='30' r='9' fill='%2377b78c' stroke='%23184635' stroke-width='3'/%3E%3Ccircle cx='52' cy='28' r='1.5' fill='%2317352a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/original.css">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/account.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container narrow">
    <h1>Tạo tài khoản</h1>
    <form id="account-form" class="form">
      <label>Tên hiển thị<input type="text" name="name" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Mật khẩu (ít nhất 8 ký tự)<input type="password" name="password" minlength="8" required></label>
      <button class="btn primary">Đăng ký</button>
      <p id="message"></p>
    </form>
    <p>Đã có tài khoản? <a href="/pages/login.html">Đăng nhập</a></p>
  </main>
  <footer>Rùa Toán Basic</footer>
</body>
</html>
