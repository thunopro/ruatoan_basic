<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tạo tài khoản Rùa Toán miễn phí để luyện tập và lưu bài làm.">
  <title>Đăng ký · Rùa Toán</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d1a0f'/%3E%3Cellipse cx='32' cy='33' rx='25' ry='23' fill='%237b5a2c' stroke='%23b6ff3b' stroke-width='3'/%3E%3Cpath d='M32 17l9 5v10l-9 5-9-5V22z' fill='%235cc85a' stroke='%230d1a0f' stroke-width='2.5'/%3E%3Cpath d='M32 37v9M23 32l-9 5M41 32l9 5M23 22l-8-5M41 22l8-5M32 17v-5M8 27h48v8H8z' stroke='%230d1a0f' stroke-width='2.5' fill='%232f8cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/original.css">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/common.js?v=4"></script>
  <script defer src="/js/account.js?v=4"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="main">
    <section class="auth-page" aria-labelledby="auth-title">
      <div class="auth-card">
        <div class="auth-brand-mark" aria-hidden="true">🐢</div>
        <p class="auth-eyebrow">RÙA TOÁN · CỘNG ĐỒNG HỌC TOÁN</p>
        <h1 id="auth-title">Tạo tài khoản</h1>
        <p class="auth-intro">Tạo tài khoản miễn phí để đồng hành cùng hành trình chinh phục toán học.</p>

        <nav class="auth-tabs" aria-label="Tài khoản">
          <a href="/pages/login.html">Đăng nhập</a>
          <a href="/pages/register.html" class="active" aria-current="page">Đăng ký</a>
        </nav>

        <form id="account-form" class="auth-form">
          <label>Tên hiển thị
            <input type="text" name="name" placeholder="Nguyễn Văn A" autocomplete="name" required>
          </label>
          <label>Email
            <input type="email" name="email" placeholder="ban@example.com" autocomplete="email" required>
          </label>
          <label>Mật khẩu (ít nhất 8 ký tự)
            <input type="password" name="password" minlength="8" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required>
          </label>
          <button class="btn primary big" type="submit" style="width:100%;margin-top:16px">Đăng ký tài khoản</button>
          <p id="message" hidden role="status"></p>
        </form>

        <div class="auth-footnote">
          <p style="margin:0">Đã có tài khoản? <a href="/pages/login.html">Đăng nhập</a></p>
        </div>
      </div>
      <p class="auth-back"><a href="/">← Quay lại trang chủ Rùa Toán</a></p>
    </section>
  </main>
  <footer class="foot">
    <div class="foot-in">
      <p class="small"><b>Rùa Toán</b> · Mật khẩu được băm PBKDF2 an toàn và phiên đăng nhập bảo vệ bằng cookie HttpOnly.</p>
    </div>
  </footer>
</body>
</html>
